[project]
name = "zigbee-live-map"
version = "0.1.1"
description = "Live animated map of a Zigbee network, from a passive 802.15.4 sniffer to your browser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["zigbee", "802.15.4", "sniffer", "cc2531", "visualization", "home-automation"]
dependencies = ["aiohttp>=3.9", "pyusb>=1.2", "truststore>=0.9", "cryptography>=42", "zeroconf>=0.130"]

[project.scripts]
zigbee-live-map = "zigbee_live_map.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zigbee_live_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
