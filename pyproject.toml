[project]
name = "zigbee-live-map"
version = "0.2.0"
description = "Live animated map of a Zigbee network, from a passive 802.15.4 sniffer to your browser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["zigbee", "802.15.4", "sniffer", "cc2531", "visualization", "home-automation"]
dependencies = ["aiohttp>=3.9", "pyusb>=1.2", "truststore>=0.9", "cryptography>=42", "zeroconf>=0.130", "hue-zigbee-encoding>=1.0"]

[project.scripts]
zigbee-live-map = "zigbee_live_map.cli:main"

[dependency-groups]
# zigpy is an oracle for the tests only: an independent Zigbee stack to check this tool's ZCL and ZDO decoders
# against. It is GPL-3.0 and is never imported by the tool itself (tests/test_oracle_zigpy.py holds that).
dev = ["pytest>=8", "zigpy>=2.4; python_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zigbee_live_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
