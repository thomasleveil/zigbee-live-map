# Home Assistant app manifest. Every key below is documented at
# https://contributors.home-assistant.io/apps/reference/configuration/ (read 2026-11-16).
name: "Zigbee Live Map"
# Quoted, and equal to `version` in pyproject.toml (a test checks it).
version: "0.1.1"
slug: "zigbee_live_map"
description: "Live animated map of your Zigbee network, from a passive USB sniffer dongle"
url: "https://github.com/thomasleveil/zigbee-live-map"
# The published multi-arch image, without a tag: the Supervisor pulls the tag equal to `version`
# (https://contributors.home-assistant.io/apps/guides/publishing/). .github/workflows/build-app.yaml builds and pushes it.
# To build the app on the Home Assistant machine instead (the local_apps folder), comment this line out.
image: "ghcr.io/thomasleveil/zigbee-live-map"
# The two architectures the docs list as current. Both bases below are multi-arch.
arch:
  - aarch64
  - amd64

# The base image's entrypoint is S6 overlay's /init, which must be process 1:
# "init: false" (https://contributors.home-assistant.io/apps/guides/s6-overlay/).
init: false

# Ingress: https://contributors.home-assistant.io/apps/guides/ingress/
# The Supervisor connects from 172.30.32.2 only; start.sh passes --ingress and this same port.
ingress: true
ingress_port: 8099
panel_icon: "mdi:zigbee"
panel_title: "Zigbee map"
# Default is true, stated on purpose: the page shows live radio traffic and, once entered, network keys.
panel_admin: true

# Home Assistant Core API: lets the app read Home Assistant's device registry, so a sniffed device shows the
# friendly name the user already gave it (matched by IEEE). The Supervisor injects the token that authorises it.
# https://contributors.home-assistant.io/apps/reference/configuration/
# Changing this key on an installed app needs uninstall + reinstall: a store reload does not re-read the manifest.
homeassistant_api: true

# Raw USB (libusb/pyusb needs /dev/bus/usb, not a serial port):
# https://contributors.home-assistant.io/apps/guides/hardware/ ("usb: true", hotplug included).
# UNVERIFIED on hardware: whether this key alone lets pyusb open the CC2531 (0451:16ae).
usb: true

# Off by default (null): the page is reached through ingress. Enable it in the app's Network
# tab only to reach the page from another device, and then set a password and allowed_hosts.
ports:
  8099/tcp: null

# Options arrive in /data/options.json (https://contributors.home-assistant.io/apps/guides/options/).
options:
  channel: 11
  demo: false
  allowed_hosts: []
schema:
  channel: "int(11,26)"
  demo: bool
  password: "password?"
  allowed_hosts:
    - str
