<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee live map</title>
<style>
:root {
  --bg: #04060e; --bg2: #0b1430; --panel: #0b1122; --panel2: #121a33; --ink: #e9eeff; --muted: #a9b6d9;
  --line: #2a3760; --accent: #7fb2ff; --focusring: #ffd166; --ok: #7ee2a8; --warn: #ffb454; --bad: #ff9fb0;
  --c-poll: #b9a2ff; --c-ack: #a4b0cc; --c-link_status: #5eead4; --c-route_request: #fdba74;
  --c-route_record: #fde047; --c-data_direct: #7cb7ff; --c-data_multihop: #ff9fb0; --c-broadcast: #86efac;
  --c-beacon: #f0abfc; --c-beacon_req: #e2c4ff; --c-join: #ffffff; --c-nwk_cmd: #cbd5e1; --c-mac_cmd: #cbd5e1;
  --c-other: #9aa6c0; --c-foreign: #9aa6c0;
  --n-coord: #9cc4ff; --n-router: #5fd4e0; --n-zed: #b9a2ff; --n-focus: #ffb454; --n-unknown: #9aa6c0;
  --chipmix: 16%;
}
:root[data-theme="light"] {
  --bg: #f4f6fb; --bg2: #e6ebf7; --panel: #ffffff; --panel2: #eef1f8; --ink: #141a2b; --muted: #465070;
  --line: #c3cbe0; --accent: #1d4ed8; --focusring: #b45309; --ok: #166534; --warn: #9a3412; --bad: #9f1239;
  --c-poll: #5b21b6; --c-ack: #374151; --c-link_status: #115e59; --c-route_request: #9a3412;
  --c-route_record: #854d0e; --c-data_direct: #1e40af; --c-data_multihop: #9f1239; --c-broadcast: #166534;
  --c-beacon: #86198f; --c-beacon_req: #6b21a8; --c-join: #111827; --c-nwk_cmd: #334155; --c-mac_cmd: #334155;
  --c-other: #4b5563; --c-foreign: #4b5563;
  --n-coord: #1e40af; --n-router: #0f766e; --n-zed: #6d28d9; --n-focus: #b45309; --n-unknown: #4b5563;
  --chipmix: 10%;
}
* { box-sizing: border-box; }
html { font-size: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3 { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .7rem; }
button[aria-pressed="true"] { border-color: var(--accent); }
:focus-visible { outline: 3px solid var(--focusring); outline-offset: 2px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

.app { display: flex; flex-direction: column; height: 100vh; min-height: 44rem; }
.hud { display: flex; flex-wrap: wrap; gap: .5rem 1.3rem; align-items: center; padding: .6rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1.05rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: .45rem; padding: .15rem .7rem; border: 1px solid currentColor; border-radius: 999px; font-family: ui-monospace, Menlo, monospace; font-size: .9rem; letter-spacing: .08em; }
.pill i { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--ok); } .pill.live i { animation: blink 1.4s ease-in-out infinite; }
.pill.wait { color: var(--warn); } .pill.down { color: var(--bad); }
@keyframes blink { 50% { opacity: .25; } }
.stat { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; color: var(--muted); }
.stat b { color: var(--ink); font-size: 1.05rem; }
.stat select { padding: .1rem .3rem; color: var(--ink); }
.verdict { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; padding: .15rem .7rem; border-left: 4px solid var(--n-focus); background: var(--panel2); }
.verdict b { color: var(--n-focus); }
.verdict[hidden] { display: none; }
.hud .grow { flex: 1; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 28rem; flex: 1; min-height: 0; }
.left { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem; padding: .55rem .75rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.chip { --c: var(--c-other); display: inline-flex; align-items: center; gap: .4rem; padding: .08rem .6rem; border-radius: 999px; font-size: .88rem; font-weight: 600; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) var(--chipmix), var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 55%, var(--panel)); }
button.chip[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; border-color: var(--line); text-decoration: line-through; }
.chip .n { font-family: ui-monospace, Menlo, monospace; font-weight: 400; }
.graphwrap { position: relative; flex: 1; min-height: 18rem; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, var(--bg2), var(--bg) 72%); }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#rhythm { display: block; width: 100%; background: var(--panel); border-top: 1px solid var(--line); }
.hint { position: absolute; right: .75rem; top: .6rem; margin: 0; color: var(--muted); font-size: .9rem; max-width: 20rem; text-align: right; pointer-events: none; }

.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.side header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
.side h2 { font-size: 1.05rem; flex: 1; }
#devices { display: flex; flex-wrap: wrap; gap: .35rem; padding: .55rem .8rem; border-bottom: 1px solid var(--line); max-height: 11.5rem; overflow: auto; }
#devices button { font-size: .88rem; padding: .12rem .55rem; border-radius: 999px; }
#devices button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
#card { position: relative; flex: none; max-height: 46%; overflow: auto; background: var(--panel2); border-bottom: 1px solid var(--line); padding: .7rem .8rem; font-size: .95rem; }
#card[hidden] { display: none; }
#card h3 { font-size: 1.05rem; padding-right: 2.2rem; }
#card dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .7rem; margin: .5rem 0; }
#card dt { color: var(--muted); } #card dd { margin: 0; word-break: break-word; }
#card .close { position: absolute; right: .5rem; top: .5rem; padding: .1rem .55rem; }
#card form { display: flex; gap: .4rem; margin-top: .5rem; align-items: end; flex-wrap: wrap; }
#card form[hidden] { display: none; }
#card label { display: grid; gap: .15rem; flex: 1; font-size: .9rem; color: var(--muted); }
#card input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .5rem; min-width: 8rem; color: var(--ink); }
#btnWatch { margin-top: .5rem; }
#log { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
#log li { padding: .45rem .8rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
#log li.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
#log .l1 { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; }
#log time, #log .hop, #log .l3 { font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
#log time, #log .l3 { color: var(--muted); }
#log .l2 { font-size: .95rem; margin-top: .15rem; }

.doc { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.doc section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem; margin-top: 1.2rem; }
.doc h2 { font-size: 1.25rem; margin-bottom: .8rem; }
.doc h3 { font-size: 1.05rem; margin-bottom: .3rem; }
.doc p { margin: 0 0 .6rem; }
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: .9rem; }
.lcard { border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 8px; padding: .7rem .9rem; background: var(--panel2); }
.lcard p { margin: .4rem 0 0; font-size: .95rem; }
.concepts { columns: 2 22rem; column-gap: 1.6rem; }
.concepts div { break-inside: avoid; margin-bottom: .9rem; }
.note { color: var(--muted); font-size: .95rem; }

@media (max-width: 1000px) {
  .app { height: auto; min-height: 0; }
  .stage { grid-template-columns: 1fr; }
  .left { border-right: 0; } .graphwrap { height: 68vh; flex: none; }
  .side { height: 70vh; border-top: 1px solid var(--line); } .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pill.live i, #log li.fresh { animation: none; } }
</style>
</head>
<body>
<div class="app">
<header class="hud">
  <h1 class="brand">Zigbee <span>//</span> <span id="brand2" style="color:inherit">live map</span></h1>
  <span class="pill wait" id="conn" role="status"><i aria-hidden="true"></i><span id="connText"></span></span>
  <span class="stat" id="chanBox"><label for="chan" id="lblChan"></label> <select id="chan"></select></span>
  <span class="stat" id="pan"></span>
  <span class="stat"><b id="sTotal">0</b> <span id="lblFrames"></span></span>
  <span class="stat"><b id="sRate">0</b> /s</span>
  <span class="stat"><b id="sNodes">0</b> <span id="lblDevices"></span></span>
  <span class="verdict" id="verdict" role="status" hidden></span>
  <span class="grow"></span>
  <button type="button" id="btnAnim" aria-pressed="true"></button>
  <button type="button" id="btnTheme"></button>
  <button type="button" id="btnLang"></button>
</header>

<div class="stage">
  <div class="left">
    <div class="legend" id="legend" role="group"></div>
    <div class="graphwrap">
      <canvas id="graph" role="img"></canvas>
      <p class="hint" id="hint"></p>
    </div>
    <canvas id="rhythm" role="img"></canvas>
  </div>
  <aside class="side" id="side">
    <header>
      <h2 id="hLog"></h2>
      <span class="note" id="logInfo" role="status"></span>
      <button type="button" id="btnFreeze" aria-pressed="false"></button>
    </header>
    <div id="devices" role="group"></div>
    <div id="card" hidden>
      <button type="button" class="close" id="cardClose">×</button>
      <div id="cardBody"></div>
      <button type="button" id="btnWatch" aria-pressed="false"></button>
      <form id="renameForm">
        <label for="renameInput"><span id="lblRename"></span><input id="renameInput" maxlength="60" autocomplete="off"></label>
        <button type="submit" id="btnSave"></button>
      </form>
    </div>
    <ol id="log"></ol>
  </aside>
</div>
</div>

<main class="doc">
  <section aria-labelledby="hLearn"><h2 id="hLearn"></h2><div class="learn" id="learn"></div></section>
  <section aria-labelledby="hAnim"><h2 id="hAnim"></h2><div class="concepts" id="anim"></div></section>
  <section aria-labelledby="hConcepts"><h2 id="hConcepts"></h2><div class="concepts" id="concepts"></div></section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CAT_ORDER = ["poll", "ack", "link_status", "route_request", "route_record", "data_direct", "data_multihop", "broadcast", "beacon_req", "beacon", "join", "nwk_cmd", "mac_cmd", "foreign", "other"];
const HOP = new Set(["data_direct", "data_multihop", "route_record", "nwk_cmd", "join"]);
const SPREAD = new Set(["broadcast", "route_request", "link_status"]);
const BROADCAST = new Set(["0xffff", "0xfffd", "0xfffc", "0xfffb"]);
const MAX_EVENTS = 20000, LOG_ROWS = 250, WINDOW_S = 120;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} } };

// ------------------------------------------------------------------ texts (English, French)
const I18N = {
  en: {
    brand2: "live map", connecting: "connecting…", live: "live", demo: "demo network", replay: n => `replay ${n}`, absent: "sniffer not found", starting: "starting…", down: "disconnected",
    channel: "channel", frames: "frames", devices: "devices", animOn: "Animations: on", animOff: "Animations: off", themeLight: "Light theme", themeDark: "Dark theme", lang: "Français",
    legendAria: "Frame categories shown", graphAria: "Animated map of the Zigbee network. The device list on the right gives the same access from the keyboard.",
    rhythmAria: "Frames per category over the last two minutes", hint: "Drag a node to move it, click it to filter the log.",
    log: "Live log", freeze: "Freeze", resume: "Resume", frozen: n => `frozen, ${n} waiting`, filtered: n => `filtered on ${n}`, devicesAria: "Devices", all: "All",
    close: "Close the device sheet", rename: "Device name", save: "Save", watch: "Watch this device", unwatch: "Stop watching", now: "now", everyone: "all",
    roles: { coord: "Coordinator", router: "Router", zed: "End device", unknown: "Role not seen yet" },
    card: { role: "Role", model: "Model", short: "Short address", ieee: "IEEE", notSeen: "not seen yet", parent: "Parent", children: "Children", none: "none", relayed: "Frames relayed",
            exclBroadcast: n => `${n} (broadcasts excluded)`, polls: "Polls to its parent", sent: "Frames sent", rssi: "Received by the sniffer", last: "Last frame", ago: s => `${s} s ago`,
            beacon: "Last beacon", beaconText: (zr, zed) => `routers ${zr ? "accepted" : "refused"}, end devices ${zed ? "accepted" : "refused"}` },
    verdictWait: n => `${n}: not heard yet`,
    verdict: (n, f) => `${n}: <b>${f.polls}</b> child poll(s) · <b>${f.relayed}</b> unicast relayed · ${f.rebroadcast} broadcast(s) repeated`,
    verdictBeacon: open => ` · beacon: children ${open ? "ACCEPTED" : "refused"}`, verdictJoins: (ok, ko) => ` · associations: ${ok} accepted, ${ko} refused`,
    bc: { "0xffff": "everyone", "0xfffd": "all devices that keep listening", "0xfffc": "all routers", "0xfffb": "all low-power routers" },
    nwkLine: (a, b) => `NWK ${a} → ${b}`, radius: r => `radius ${r}`, bytes: n => `${n} bytes`,
    hLearn: "What each colour means", hAnim: "Reading the animations", hConcepts: "The ideas you need to read this network",
    cats: {
      poll: ["Data request", "A sleeping end device wakes up and asks its parent whether a message is waiting for it. This is what reveals who is whose parent."],
      ack: ["Acknowledgement", "Immediate \"got it\" from the direct neighbour, for one radio hop. Without it the sender retries. Hidden by default because it is very chatty."],
      link_status: ["Link status", "Every router tells its direct neighbours (radius 1) how well it hears each of them, every 15 seconds. The network uses it to pick the best paths."],
      route_request: ["Route request", "A network command flooded through all routers. From the coordinator it is probably a \"many-to-one\" announcement: it tells the whole network how to reach it."],
      route_record: ["Route record (probable)", "A command sent to the coordinator. Each relay appends its own address, so the frame grows by 2 bytes per hop. The coordinator learns the way back."],
      data_direct: ["Direct data", "An application message (measurement, command) delivered in a single hop: the radio sender is the author and the radio receiver is the recipient."],
      data_multihop: ["Relayed data", "An application message on a multi-hop path: the radio address (MAC) differs from the author or the final recipient (NWK). A router is in the middle."],
      broadcast: ["Broadcast", "A message for everyone. Each router repeats it once, which carries it across the whole network. Any router does this."],
      beacon_req: ["Network search", "A device looking for a network to join, or to find again, asks nearby routers to show themselves."],
      beacon: ["Beacon", "A router's answer to a network search. It says in clear whether it still accepts routers and end devices as children, and whether joining is open."],
      join: ["Association", "A device asks a router to become its parent, and the router answers. The outcome (accepted, network full, denied) travels in clear."],
      nwk_cmd: ["Network command", "Another network-layer command (leave, rejoin, channel change…). Its exact type is encrypted."],
      mac_cmd: ["Radio command", "Another radio-layer (MAC) command."],
      foreign: ["Neighbouring network", "A frame from another 802.15.4 network on the same channel (different PAN id), a neighbour's for instance. It is not part of your network and is kept off the map."],
      other: ["Not decoded", "An 802.15.4 frame that is not readable Zigbee PRO (Green Power, another protocol, a damaged frame)."],
    },
    anim: [
      ["A dot running along a line", "A frame addressed to one device: the dot leaves the radio sender and reaches the radio receiver. When a message crosses several routers you see the dots chain up, one hop after the other."],
      ["A widening ring", "A broadcast: the device talks to everyone in range. The small regular teal rings are each router's link status. A large ring repeated from node to node is a broadcast spreading."],
      ["A dotted line", "The parent-child relation, deduced from data requests: a battery device always polls its parent."],
      ["A solid line", "A radio hop that addressed traffic has already used. It lights up on every passage, then fades."],
    ],
    concepts: [
      ["Three roles", "The <b>coordinator</b> creates the network and runs it. <b>Routers</b> are mains-powered (plugs, meters) and forward other devices' messages. <b>End devices</b> (sensors, radiator valves) sleep to save their battery and go through a \"parent\" router."],
      ["Two layers of addresses", "Every frame carries two pairs of addresses. The <b>MAC</b> layer says who transmits and who receives <i>this radio hop</i>. The <b>NWK</b> layer says who wrote the message and who it is finally for. When they differ, a router is relaying."],
      ["Short address and IEEE", "The <b>short</b> address (like 0x2B01) is handed out when a device joins and can change. The <b>IEEE</b> address (64 bits) is burnt into the chip. It travels in the security header of each hop, which is how a short address is tied to a name."],
      ["Radius", "The <b>radius</b> is the number of hops left. Every relaying router decreases it by 1. A broadcast that starts at 10 and shows up again at 9, then 8, is spreading through the mesh."],
      ["Encryption", "Everything after the NWK header is encrypted with the network key, and this tool leaves it that way. You see who talks to whom, when and how much, never the content. Network commands are recognised by their shape, and marked \"probable\" when that is a deduction."],
      ["What the sniffer hears", "The dongle only hears what reaches it. A distant device may be missing from the map, and the power shown (dBm) is what the sniffer received, not the link quality between two devices."],
    ],
    explain(e, x) {
      const { ms, md, relay, L, who } = x;
      switch (e.cat) {
        case "poll": return `${L(ms)} wakes up and asks its parent ${L(md)} whether a message is waiting.`;
        case "ack": return ms ? `${L(ms)} confirms to ${L(md)} that the previous frame arrived.` : "Acknowledgement of one radio hop.";
        case "link_status": return `${L(ms)} tells its direct neighbours how well it hears them.`;
        case "route_request": return relay ? `${L(ms)} repeats the route request from ${L(e.ns)} (radius left ${e.r}).` : `${L(e.ns)} floods a route request to the whole network (radius ${e.r}).`;
        case "route_record": return relay ? `${L(ms)} relays to ${L(md)} the route record of ${L(e.ns)}, adding its own address (${e.len} bytes).` : `${L(e.ns)} sends its path to the coordinator through ${L(md)} (${e.len} bytes).`;
        case "data_direct": return `${L(e.ns)} sends an encrypted message straight to ${L(e.nd)}.`;
        case "data_multihop": return (relay ? `${L(ms)} relays a message from ${L(e.ns)} meant for ${L(e.nd)}, handing it to ${L(md)}.` : `${L(e.ns)} hands ${L(md)} a message meant for ${L(e.nd)}.`) + (e.relays && e.relays.length ? ` Route chosen by the sender: ${e.relays.map(L).join(", ")}.` : "");
        case "broadcast": return relay ? `${L(ms)} repeats a broadcast from ${L(e.ns)} to spread it.` : `${L(e.ns)} broadcasts a message to ${who(e.nd)}.`;
        case "beacon_req": return "A device is looking for a network and asks nearby routers to show themselves.";
        case "beacon": { const b = e.bcn || {}; const yn = v => v ? "yes" : "no"; return `${L(ms)} shows itself. Accepts routers: ${yn(b.zr)}. Accepts end devices: ${yn(b.zed)}. Joining open: ${yn(b.permit)}.`; }
        case "join": return e.st === undefined ? `${L(ms)} asks ${L(md)} to become its parent.` : `${L(ms)} answers the association request: ${({ 0: "accepted", 1: "refused, no room left (network full)", 2: "refused, access denied" })[e.st] || "code " + e.st}.`;
        case "foreign": return `Frame from a neighbouring network (PAN ${e.pan})${e.rssi != null ? `, received at ${e.rssi} dBm` : ""}. It does not concern your network.`;
        default: return this.cats[e.cat] ? this.cats[e.cat][1] : this.cats.other[1];
      }
    },
  },
  fr: {
    brand2: "carte en direct", connecting: "connexion…", live: "en direct", demo: "réseau de démonstration", replay: n => `rejeu ${n}`, absent: "sniffer absent", starting: "démarrage…", down: "déconnecté",
    channel: "canal", frames: "trames", devices: "appareils", animOn: "Animations : oui", animOff: "Animations : non", themeLight: "Thème clair", themeDark: "Thème sombre", lang: "English",
    legendAria: "Catégories de trames affichées", graphAria: "Carte animée du réseau Zigbee. La liste des appareils à droite donne le même accès au clavier.",
    rhythmAria: "Trames par catégorie sur les deux dernières minutes", hint: "Glisse un nœud pour le déplacer, clique dessus pour filtrer le journal.",
    log: "Journal en direct", freeze: "Figer", resume: "Reprendre", frozen: n => `figé, ${n} en attente`, filtered: n => `filtré sur ${n}`, devicesAria: "Appareils", all: "Tous",
    close: "Fermer la fiche", rename: "Nom de l'appareil", save: "Enregistrer", watch: "Surveiller cet appareil", unwatch: "Ne plus surveiller", now: "maintenant", everyone: "tous",
    roles: { coord: "Coordinateur", router: "Routeur", zed: "Appareil final", unknown: "Rôle pas encore vu" },
    card: { role: "Rôle", model: "Modèle", short: "Adresse courte", ieee: "IEEE", notSeen: "pas encore vue", parent: "Parent", children: "Enfants", none: "aucun", relayed: "Trames relayées",
            exclBroadcast: n => `${n} (hors diffusions)`, polls: "Requêtes à son parent", sent: "Trames émises", rssi: "Reçu par le sniffer", last: "Dernière trame", ago: s => `il y a ${s} s`,

function drawRhythm() {

  const { w, h, dpr } = sizeCanvas(c), g = c.getContext("2d"), L = Math.min(250, w * .42), R = w - 10, now = Date.now() / 1000;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.font = "13px ui-monospace, 'SF Mono', Menlo, monospace"; g.textBaseline = "middle";
  const rows = new Map(cats.map((k, i) => [k, i]));
  cats.forEach((k, i) => { g.fillStyle = rgba(pal.cat[k], pal.dark ? .1 : .12); g.fillRect(L, i * rowH + 4, R - L, rowH - 5); g.fillStyle = rgba(pal.cat[k], 1); g.textAlign = "left"; g.fillText(catLabel(k), 10, i * rowH + rowH / 2 + 2, L - 16); });

}

// ------------------------------------------------------------------ panels
function renderLegend(force) {
  const box = $("legend"), cats = CAT_ORDER.filter(k => S.counts[k] || k === "ack");
  if (force || box.children.length !== cats.length) {
    box.innerHTML = "";
    for (const k of cats) {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.cat = k; b.style.setProperty("--c", `var(--c-${k})`);
      b.innerHTML = `${esc(catLabel(k))} <span class="n"></span>`; b.title = (T.cats[k] || T.cats.other)[1];
      b.addEventListener("click", () => { hidden.has(k) ? hidden.delete(k) : hidden.add(k); renderLegend(); renderLog(); });
      box.appendChild(b);
    }
  }
  for (const b of box.children) { const k = b.dataset.cat; b.setAttribute("aria-pressed", String(!hidden.has(k))); b.querySelector(".n").textContent = S.counts[k] || 0; }
}
function renderDevices() {
  const box = $("devices"); box.innerHTML = "";
  const order = { coord: 0, router: 1, zed: 2, unknown: 3 };
  const list = [...S.nodes.values()].sort((a, b) => order[role(a)] - order[role(b)] || label(a.addr).localeCompare(label(b.addr)));
  const all = document.createElement("button"); all.type = "button"; all.textContent = T.all; all.setAttribute("aria-pressed", String(!sel)); all.addEventListener("click", () => select(null)); box.appendChild(all);
  for (const n of list) {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = `${({ coord: "■", router: "●", zed: "○", unknown: "·" })[role(n)]} ${label(n.addr)}`;
    b.setAttribute("aria-label", `${label(n.addr)}, ${T.roles[role(n)]}`); b.setAttribute("aria-pressed", String(sel === n.addr));

  const kids = [...S.nodes.values()].filter(k => k.parent === sel).map(k => label(k.addr));

    <p>${Object.entries(n.cats).sort((a, b) => b[1] - a[1]).map(([c, k]) => chip(c, ` <span class="n">${k}</span>`)).join(" ")}</p>`;

function select(addr) {
  sel = sel === addr ? null : addr;
  if (sel && S.nodes.has(sel)) $("renameInput").value = nameOf(S.nodes.get(sel)) || "";
  renderDevices(); renderCard(); renderLog();
}

// ------------------------------------------------------------------ language, theme, static text
function applyLang() {
  T = I18N[lang]; document.documentElement.lang = lang; document.title = lang === "fr" ? "Zigbee, carte en direct" : "Zigbee live map";
  $("brand2").textContent = T.brand2; $("lblChan").textContent = T.channel; $("lblFrames").textContent = T.frames; $("lblDevices").textContent = T.devices;
  $("btnAnim").textContent = animOn ? T.animOn : T.animOff; $("btnLang").textContent = T.lang; $("btnLang").lang = lang === "fr" ? "en" : "fr";
  $("btnTheme").textContent = document.documentElement.dataset.theme === "dark" ? T.themeLight : T.themeDark;

  $("hint").textContent = T.hint; $("hLog").textContent = T.log; $("side").setAttribute("aria-label", T.log); $("btnFreeze").textContent = frozen ? T.resume : T.freeze;
  $("devices").setAttribute("aria-label", T.devicesAria); $("cardClose").setAttribute("aria-label", T.close); $("lblRename").textContent = T.rename; $("btnSave").textContent = T.save;
  $("hLearn").textContent = T.hLearn; $("hAnim").textContent = T.hAnim; $("hConcepts").textContent = T.hConcepts;

function setTheme(t) { document.documentElement.dataset.theme = t; store.set("zlm-theme", t); loadPal(); $("btnTheme").textContent = t === "dark" ? T.themeLight : T.themeDark; }
$("btnTheme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
$("btnLang").addEventListener("click", () => { lang = lang === "fr" ? "en" : "fr"; store.set("zlm-lang", lang); applyLang(); });
$("btnAnim").addEventListener("click", () => { animOn = !animOn; $("btnAnim").setAttribute("aria-pressed", String(animOn)); $("btnAnim").textContent = animOn ? T.animOn : T.animOff; });

$("btnAnim").setAttribute("aria-pressed", String(animOn));
for (let c = 11; c <= 26; c++) { const o = document.createElement("option"); o.value = c; o.textContent = c; $("chan").appendChild(o); }

// ------------------------------------------------------------------ pointer and card interactions
function hit(ev) {

}

});

$("renameForm").addEventListener("submit", ev => {
  ev.preventDefault(); const n = S.nodes.get(sel);
  if (n && n.ieee && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "rename", ieee: n.ieee, name: $("renameInput").value }));
});

// ------------------------------------------------------------------ websocket
function setNames(names) {
  S.names = names || {}; S.hint = new Map();
  for (const [ieee, m] of Object.entries(S.names)) if (m && m.nwk) S.hint.set(String(m.nwk).toLowerCase(), ieee);
}
function connect() {

      S.focusIeee = (d.mode !== "demo" && store.get("zlm-focus")) || d.focus || null;
      $("chanBox").hidden = !S.canTune; if (S.channel) $("chan").value = S.channel;
      $("log").innerHTML = ""; dirty.devices = dirty.card = dirty.legend = true; renderLegend(true);
    }
    else if (d.type === "backlog") { for (const e of d.events) processEvent(e, false); renderLog(); }

// ------------------------------------------------------------------ start
document.documentElement.dataset.theme = store.get("zlm-theme") === "light" ? "light" : "dark";
loadPal(); applyLang(); connect();
let last = performance.now();
function frame(ts) { physics(Math.min(.05, (ts - last) / 1000)); last = ts; draw(ts); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
setInterval(() => {
  renderHud(); drawRhythm();
  if (dirty.legend) { renderLegend(); dirty.legend = false; }
  if (dirty.devices) { renderDevices(); dirty.devices = false; }
  if (dirty.card) { renderCard(); dirty.card = false; }
}, 400);
