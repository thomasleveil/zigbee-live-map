<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee live map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
.app { display: flex; flex-direction: column; height: 100vh; min-height: 44rem; }
.pill { display: inline-flex; align-items: center; gap: .45rem; padding: .15rem .7rem; border: 1px solid currentColor; border-radius: 999px; font-family: ui-monospace, Menlo, monospace; font-size: .9rem; letter-spacing: .08em; }
.pill i { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--ok); } .pill.live i { animation: blink 1.4s ease-in-out infinite; }
.pill.wait { color: var(--warn); } .pill.down { color: var(--bad); }
@keyframes blink { 50% { opacity: .25; } }
.stat { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; color: var(--muted); }
.stat b { color: var(--ink); font-size: 1.05rem; }
.stat select { padding: .1rem .3rem; }
.verdict { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; padding: .15rem .7rem; border-left: 4px solid var(--n-focus); background: var(--panel2); }
.verdict b { color: var(--n-focus); }
.verdict[hidden] { display: none; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 28rem; flex: 1; min-height: 0; }
.stage.detail-open { grid-template-columns: minmax(16rem, 23rem) minmax(0, 1fr) 28rem; }
.left { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem; padding: .55rem .75rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.graphwrap { position: relative; flex: 1; min-height: 18rem; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, var(--bg2), var(--bg) 72%); }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#rhythm { display: block; width: 100%; background: var(--panel); border-top: 1px solid var(--line); }
.hint { position: absolute; right: .75rem; top: .6rem; margin: 0; color: var(--muted); font-size: .9rem; max-width: 20rem; text-align: right; pointer-events: none; }

.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.side > header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
.side h2 { font-size: 1.05rem; flex: 1; }
#devices { display: flex; flex-wrap: wrap; gap: .35rem; padding: .55rem .8rem; border-bottom: 1px solid var(--line); max-height: 9.5rem; overflow: auto; }
#devices button { font-size: .88rem; padding: .12rem .55rem; border-radius: 999px; }
#devices button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
#issues { border-bottom: 1px solid var(--line); padding: .5rem .8rem; max-height: 30%; overflow: auto; flex: none; }
#issues summary { cursor: pointer; font-weight: 700; }
#issues summary .n { font-family: ui-monospace, Menlo, monospace; font-weight: 400; padding: 0 .45rem; border: 1px solid currentColor; border-radius: 999px; margin-left: .3rem; }
#issues.has summary .n { color: var(--warn); }
#issues ul { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: .3rem; }
#issues li button { width: 100%; text-align: left; border-left: 4px solid var(--warn); font-size: .95rem; }
#issues p { margin: .4rem 0 0; }
.detail { display: flex; flex-direction: column; min-height: 0; overflow: auto; background: var(--panel); border-right: 1px solid var(--line); font-size: .95rem; }
.detail[hidden] { display: none; }
.detailHead { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.detailHead h2 { flex: 1; font-size: 1.05rem; word-break: break-word; }
.detailGroup { padding: .6rem .8rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.detailGroup > h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .35rem; }
.detailGroup.keyed { border-left: 3px solid var(--accent); }
.detailGroup.keyed > h3 { color: var(--accent); }
.detailActions { padding: .6rem .8rem; display: grid; gap: .5rem; }
#card dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .7rem; margin: .5rem 0; }
#card dt { color: var(--muted); } #card dd { margin: 0; word-break: break-word; }
#card ul { margin: .2rem 0 .5rem; padding-left: 1.1rem; }
#card .close { padding: .1rem .55rem; }
#card form { display: flex; gap: .4rem; margin-top: .5rem; align-items: end; flex-wrap: wrap; }
#card form[hidden], #btnWatch[hidden] { display: none; }
#card label { display: grid; gap: .15rem; flex: 1; font-size: .9rem; color: var(--muted); }
#card input { min-width: 8rem; }
#btnWatch { margin-top: .5rem; }
#log { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
#log li { padding: .45rem .8rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
#log li.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
#log .l1 { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; }
#log time, #log .hop, #log .l3 { font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
#log time, #log .l3 { color: var(--muted); }
#log .l2 { font-size: .95rem; margin-top: .15rem; }

.doc { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.doc section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem; margin-top: 1.2rem; }
.doc h2 { font-size: 1.25rem; margin-bottom: .8rem; }
.doc h3 { font-size: 1.05rem; margin-bottom: .3rem; }
.doc p { margin: 0 0 .6rem; }
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: .9rem; }
.lcard { border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 8px; padding: .7rem .9rem; background: var(--panel2); }
.lcard p { margin: .4rem 0 0; font-size: .95rem; }
.concepts { columns: 2 22rem; column-gap: 1.6rem; }
.concepts div { break-inside: avoid; margin-bottom: .9rem; }

@media (max-width: 1000px) {
  .app { height: auto; min-height: 0; }
  .stage, .stage.detail-open { grid-template-columns: 1fr; }
  .detail { max-height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .left { border-right: 0; } .graphwrap { height: 68vh; flex: none; }
  .side { height: 80vh; border-top: 1px solid var(--line); } .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pill.live i, #log li.fresh { animation: none; } }

#btnSecurity.vuln { color: var(--bad); border-color: var(--bad); font-weight: 700; }
.secbox { border-left: 4px solid var(--line); background: var(--panel2); padding: .6rem .8rem; border-radius: 0 6px 6px 0; }
.secbox.vuln { border-left-color: var(--bad); }
.secbox.safe { border-left-color: var(--ok); }
.secbox.wait { border-left-color: var(--warn); }
.secbox b { font-size: 1.05rem; }
.secbox .keyval { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; word-break: break-all; display: block; margin-top: .4rem; padding: .35rem .5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
.wizard { margin: .3rem 0 0; padding-left: 1.3rem; } .wizard li { margin: .25rem 0; }
.keyform { display: flex; gap: .4rem; flex-wrap: wrap; align-items: end; margin-top: .4rem; }
.keyform label { flex: 1; display: grid; gap: .15rem; font-size: .9rem; color: var(--muted); min-width: 14rem; }
.keyform input { font-family: ui-monospace, Menlo, monospace; }
#card .ident { border-left: 3px solid var(--accent); padding-left: .5rem; margin: .4rem 0; }
#card .costs { list-style: none; margin: .2rem 0 .5rem; padding: 0; font-family: ui-monospace, Menlo, monospace; font-size: .9rem; }
#card .costs li { display: flex; justify-content: space-between; gap: 1rem; }
#card .costs .hi { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<div class="app">
<header class="hud">
  <h1 class="brand">Zigbee <i>//</i> <span data-i18n="app.brand2"></span></h1>
  <span class="pill wait" id="conn" role="status"><i aria-hidden="true"></i><span id="connText"></span></span>
  <span class="stat" id="chanBox" hidden data-i18n-title="tip.channel"><label for="chan" data-i18n="hud.channel"></label> <select id="chan"></select></span>
  <span class="stat" id="pan" data-i18n-title="tip.pan"></span>
  <span class="stat" data-i18n-title="tip.frames"><b id="sTotal">0</b> <span data-i18n="hud.frames"></span></span>
  <span class="stat" data-i18n-title="tip.rate"><b id="sRate">0</b> /s</span>
  <span class="stat" data-i18n-title="tip.count"><b id="sNodes">0</b> <span data-i18n="hud.devices"></span></span>
  <span class="verdict" id="verdict" role="status" hidden></span>
  <span class="grow"></span>
  <a class="btn" href="/devices" data-i18n="nav.devices" data-i18n-title="tip.devices"></a>
  <button type="button" id="btnSecurity" data-i18n="nav.security" data-i18n-title="tip.security"></button>
  <button type="button" id="btnSettings" data-i18n="nav.settings" data-i18n-title="tip.settings"></button>
</header>

<div class="stage" id="stage">
  <aside class="detail" id="card" hidden aria-labelledby="detailName">
    <div class="detailHead">
      <h2 id="detailName"></h2>
      <button type="button" class="close" id="cardClose" data-i18n-aria="card.close">×</button>
    </div>
    <div id="cardBody"></div>
    <div class="detailActions">
      <button type="button" id="btnWatch" aria-pressed="false" data-i18n-title="tip.watch"></button>
      <form id="renameForm">
        <label for="renameInput"><span data-i18n="card.rename"></span><input id="renameInput" type="text" maxlength="60" autocomplete="off"></label>
        <button type="submit" data-i18n="card.save"></button>
      </form>
    </div>
  </aside>
  <div class="left">
    <div class="legend" id="legend" role="group" data-i18n-aria="map.legendAria"></div>
    <div class="graphwrap">
      <canvas id="graph" role="img" data-i18n-aria="map.graphAria"></canvas>
      <p class="hint" data-i18n="map.hint"></p>
    </div>
    <canvas id="rhythm" role="img" data-i18n-aria="map.rhythmAria"></canvas>
  </div>
  <aside class="side" data-i18n-aria="log.title">
    <header>
      <h2 data-i18n="log.title"></h2>
      <span class="note" id="logInfo" role="status"></span>
      <button type="button" id="btnFreeze" aria-pressed="false" data-i18n-title="tip.freeze"></button>
    </header>
    <div id="devices" role="group" data-i18n-aria="devices.aria"></div>
    <details id="issues">
      <summary><span data-i18n="issues.title"></span><span class="n" id="issuesCount">0</span></summary>
      <ul id="issuesList"></ul>
      <p class="note" id="issuesNone" data-i18n="issues.none"></p>
      <p class="note" data-i18n="issues.help"></p>
    </details>
    <ol id="log"></ol>
  </aside>
</div>
</div>

<main class="doc">
  <section aria-labelledby="hLearn"><h2 id="hLearn" data-i18n="sec.learn"></h2><div class="learn" id="learn"></div></section>
  <section aria-labelledby="hAnim"><h2 id="hAnim" data-i18n="sec.anim"></h2><div class="concepts" id="anim"></div></section>
  <section aria-labelledby="hConcepts"><h2 id="hConcepts" data-i18n="sec.concepts"></h2><div class="concepts" id="concepts"></div></section>
</main>

<script>
"use strict";
const { t, esc, rich, prefs } = ZLM;
const $ = id => document.getElementById(id);
const CAT_ORDER = ["poll", "ack", "link_status", "route_request", "route_record", "data_direct", "data_multihop", "broadcast", "beacon_req", "beacon", "join", "nwk_cmd", "mac_cmd", "foreign", "other"];
const HOP = new Set(["data_direct", "data_multihop", "route_record", "nwk_cmd", "join"]);
const SPREAD = new Set(["broadcast", "route_request", "link_status"]);
const BROADCAST = new Set(["0xffff", "0xfffd", "0xfffc", "0xfffb"]);
const MAX_EVENTS = 20000, LOG_ROWS = 250, WINDOW_S = 120;
const FORWARD_TIMEOUT_S = 12;        // a frame not relayed after this long is counted as not relayed
const LINK_MIN_FRAMES = 20;          // below this, a retransmission rate says nothing
const RETRY_EMA = 0.05;              // the retry rate is a moving average, so it falls again when a link recovers
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const catLabel = c => t(`cat.${ZLM.has(`cat.${c}.label`) ? c : "other"}.label`);
const catLearn = c => t(`cat.${ZLM.has(`cat.${c}.learn`) ? c : "other"}.learn`);

// ------------------------------------------------------------------ state
let S, pal, sel = null, frozen = false, animOn = !RM && prefs.get("anim", "on") !== "off", ws = null, connOpen = false, sniffer = { sniffer: "starting", detail: "" }, pending = 0;
const hidden = new Set(["ack"]), parts = [], rings = [];
const dirty = { devices: true, card: true, legend: true, security: true };
const newFocus = () => ({ polls: 0, relayed: 0, rebroadcast: 0, beacon: null, joins: [] });
function reset() {
  S = { pans: {}, hint: new Map(), nodes: new Map(), links: new Map(), pairs: new Map(), waiting: new Map(), lastHandover: null, sweptAt: 0, ghostsAt: 0, events: [], counts: {},
        ieee2addr: new Map(), names: {}, vendors: {}, focusIeee: null, focusAddr: null, total: 0, recent: [], pan: null, mode: "live", channel: null, canTune: false, focus: newFocus(),
        security: { vulnerable: false, secureJoinSeen: false, keyKnown: false, keySource: null, key: null }, identities: {}, costs: {}, batteries: {} };
  parts.length = 0; rings.length = 0;
}
reset();

const key = a => (a && a.includes(":")) ? (S.ieee2addr.get(a) || a) : a;
const nameOf = n => (n && n.ieee && S.names[n.ieee] && S.names[n.ieee].name) || null;
const label = a => { const n = S.nodes.get(a); return nameOf(n) || a || "?"; };
const who = a => BROADCAST.has(a) ? t("bc." + a) : label(a);
const role = n => n.addr === "0x0000" ? "coord" : n.router ? "router" : n.zed ? "zed" : "unknown";
const isFocus = n => !!S.focusIeee && n.ieee === S.focusIeee;
const sleepyChildOf = (child, parent) => { const c = S.nodes.get(child); return !!(c && c.zed && !c.router && c.parent === parent); };

function node(addr) {
  let n = S.nodes.get(addr);
  if (!n) {
    const a = Math.random() * 6.283, r = 140 + Math.random() * 90;
    n = { addr, ieee: null, router: false, zed: false, parent: null, x: Math.cos(a) * r, y: Math.sin(a) * r, vx: 0, vy: 0,
          sent: 0, unicast: 0, retries: 0, cats: {}, polls: 0, relayed: 0, pulse: 0, phase: Math.random() * 6.283, last: 0, rssi: null, beacon: null, ghostAt: null,
          fwd: { n: 0, sum: 0, max: 0, lost: 0 }, ind: { n: 0, sum: 0, max: 0, lost: 0 } };
    const hinted = S.hint.get(addr);                // short address from a device list, until the IEEE is heard
    if (hinted && !S.ieee2addr.has(hinted)) { n.ieee = hinted; S.ieee2addr.set(hinted, addr); if (hinted === S.focusIeee) S.focusAddr = addr; }
    S.nodes.set(addr, n); dirty.devices = true;
  }
  return n;
}
const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
function link(a, b) {
  let l = S.links.get(pairKey(a, b));
  if (!l) { l = { a: a < b ? a : b, b: a < b ? b : a, count: 0, heat: 0 }; S.links.set(pairKey(a, b), l); }
  return l;
}
// Delivery quality of a pair of devices: how often an addressed frame had to be sent again.
function pair(a, b) {
  let p = S.pairs.get(pairKey(a, b));
  if (!p) { p = { a: a < b ? a : b, b: a < b ? b : a, frames: 0, retries: 0, rate: 0 }; S.pairs.set(pairKey(a, b), p); }
  return p;
}
const retryRate = p => p ? p.rate : 0;   // moving average of "this frame was a retransmission"
const rated = p => !!p && p.frames >= LINK_MIN_FRAMES;
const quality = p => !rated(p) ? "unknown" : retryRate(p) >= .15 ? "poor" : retryRate(p) >= .05 ? "fair" : "good";

// ------------------------------------------------------------------ event intake
function tallyFocus(e, ms, md) {
  const f = S.focusAddr; if (!f) return;
  if (e.cat === "poll" && md === f) S.focus.polls++;
  if (ms === f && e.ns && e.ns !== f) { if (HOP.has(e.cat)) S.focus.relayed++; else if (SPREAD.has(e.cat)) S.focus.rebroadcast++; }
  if (e.cat === "beacon" && ms === f) S.focus.beacon = e.bcn;
  if (e.cat === "join" && e.st !== undefined && ms === f) S.focus.joins.push(e.st);
}
function recountFocus() { S.focus = newFocus(); for (const e of S.events) if (e.cat !== "foreign") tallyFocus(e, key(e.ms), key(e.md)); }
function setFocus(ieee, remember) {
  S.focusIeee = ieee || null; S.focusAddr = ieee ? (S.ieee2addr.get(ieee) || null) : null;
  if (remember && S.mode !== "demo") prefs.set("focus", ieee || null);
  recountFocus(); dirty.card = true;
}
// A router that receives a frame for someone else has to send it on. Measure how long that takes.
function trackForward(e, ms, md) {
  if (!HOP.has(e.cat) || e.q == null || !e.ns) return;
  if (ms && ms !== e.ns) {
    const k = `${ms}|${e.ns}|${e.q}|${e.nd}`, w = S.waiting.get(k);
    if (w) { S.waiting.delete(k); const b = sleepyChildOf(e.nd, ms) ? S.nodes.get(ms).ind : S.nodes.get(ms).fwd, d = Math.max(0, e.t - w.t); b.n++; b.sum += d; b.max = Math.max(b.max, d); }
  }
  if (md && md !== e.nd) {
    const k = `${md}|${e.ns}|${e.q}|${e.nd}`;
    if (!S.waiting.has(k)) S.waiting.set(k, { t: e.t, router: md, from: ms, target: e.nd, acked: false });
    S.lastHandover = k;                       // its acknowledgement, if any, is the very next frame
  }
  if (e.t - S.sweptAt >= 1) {
    S.sweptAt = e.t;
    for (const [k, w] of S.waiting) if (e.t - w.t > FORWARD_TIMEOUT_S) {
      S.waiting.delete(k); const n = S.nodes.get(w.router);
      if (n && w.acked) (sleepyChildOf(w.target, w.router) ? n.ind : n.fwd).lost++;   // never acknowledged: the router did not get it, the link is to blame
    }
  }
}
const GHOST_AFTER_S = 45;
function removeNode(addr) {
  S.nodes.delete(addr);
  for (const map of [S.links, S.pairs]) for (const [k, v] of map) if (v.a === addr || v.b === addr) map.delete(k);
  for (const [k, w] of S.waiting) if (w.router === addr) S.waiting.delete(k);
  for (const n of S.nodes.values()) if (n.parent === addr) n.parent = null;
  if (sel === addr) sel = null;
  dirty.devices = dirty.card = true;
}
function sweepGhosts(now) {
  if (now - S.ghostsAt < 1) return;
  S.ghostsAt = now;
  for (const n of [...S.nodes.values()]) if (n.ghostAt != null && now - n.ghostAt > GHOST_AFTER_S) removeNode(n.addr);
}
function processEvent(e, live) {
  if (e.pan && e.pan !== "0xffff") { S.pans[e.pan] = (S.pans[e.pan] || 0) + 1; if (!S.pan || S.pans[e.pan] > S.pans[S.pan]) S.pan = e.pan; }
  const foreign = e.pan && e.pan !== "0xffff" && e.pan !== S.pan;    // another network on this channel: logged, never mapped
  if (foreign) e.cat = "foreign";
  S.total++; S.counts[e.cat] = (S.counts[e.cat] || 0) + 1;
  S.events.push(e); if (S.events.length > MAX_EVENTS) S.events.splice(0, S.events.length - MAX_EVENTS);
  dirty.legend = true;
  if (live) S.recent.push(performance.now());
  if (foreign) { if (live) logLive(e); return; }
  const ms = key(e.ms), md = key(e.md), toAll = BROADCAST.has(md);
  if (ms) {
    const n = node(ms); n.sent++; n.cats[e.cat] = (n.cats[e.cat] || 0) + 1; n.last = e.t;
    if (e.cat !== "ack") n.ghostAt = null;       // still talking under this address: not a ghost
    if (e.rssi != null) n.rssi = e.rssi;
    if (e.ieee && !ms.includes(":") && n.ieee !== e.ieee) {
      const stale = S.nodes.get(S.ieee2addr.get(e.ieee));     // same device under a new short address (it rejoined), or a wrong hint
      if (stale && stale !== n && stale.ieee === e.ieee) { stale.ieee = null; stale.ghostAt = e.t; }
      n.ieee = e.ieee; S.ieee2addr.set(e.ieee, ms); dirty.devices = true;
      if (e.ieee === S.focusIeee && S.focusAddr !== ms) { S.focusAddr = ms; S.events.pop(); recountFocus(); S.events.push(e); }
    }
    if (e.cat === "link_status" || e.cat === "beacon") n.router = true;
    if (e.cat === "beacon") n.beacon = e.bcn;
    if (e.ns && e.ns !== ms && (HOP.has(e.cat) || SPREAD.has(e.cat))) { n.router = true; if (HOP.has(e.cat)) n.relayed++; }
    if (e.cat === "poll" && md && !toAll) { n.zed = true; n.polls++; if (n.parent !== md) { n.parent = md; dirty.devices = true; } }
  }
  if (md && !toAll) node(md);
  if (e.ns && !BROADCAST.has(e.ns)) node(e.ns);
  if (e.nd && !BROADCAST.has(e.nd)) node(e.nd);
  if (ms && md && !toAll && e.cat !== "ack") {
    const p = pair(ms, md), n = S.nodes.get(ms); p.frames++; n.unicast++;
    p.rate += ((e.rt ? 1 : 0) - p.rate) * RETRY_EMA;   // decays as good frames arrive, so a healed link clears
    if (e.rt) { p.retries++; n.retries++; }
    if (HOP.has(e.cat)) { const l = link(ms, md); l.count++; if (live) l.heat = 1; }

  const ago = n.last ? Math.max(0, Math.round(Date.now() / 1000 - n.last)) : null, c = k => t("card." + k);
  const fwdTotal = n.fwd.n + n.fwd.lost, id = S.identities[n.addr] || null;
  // What the sniffer reads from the clear headers, with no key.
  const clear = [[c("role"), t("role." + rl)], meta.model ? [c("model"), meta.model] : null, n.ieee && S.vendors[n.ieee] ? [c("vendor"), S.vendors[n.ieee]] : null,
    [c("short"), n.addr], [c("ieee"), n.ieee || c("notSeen")],
    n.parent ? [c("parent"), label(n.parent)] : null,
    rl !== "zed" ? [c("children"), kids.length ? kids.join(", ") : c("none")] : null,
    rl !== "zed" ? [c("relayed"), t("card.relayedValue", { n: n.relayed })] : [c("polls"), n.polls],
    [c("sent"), n.sent],
    n.unicast ? [c("retries"), t("card.retriesValue", { n: n.retries, total: n.unicast, pct: Math.round(100 * n.retries / n.unicast) })] : null,
    n.fwd.n ? [c("forward"), t("card.forwardValue", { avg: ms1(n.fwd.sum / n.fwd.n), max: ms1(n.fwd.max), n: n.fwd.n })] : null,
    n.fwd.lost ? [c("notForwarded"), t("card.notForwardedValue", { n: n.fwd.lost, total: fwdTotal })] : null,
    n.ind.n || n.ind.lost ? [c("indirect"), t("card.indirectValue", { n: n.ind.n, avg: n.ind.n ? (n.ind.sum / n.ind.n).toFixed(1) : "0", lost: n.ind.lost })] : null,
    n.rssi != null ? [c("rssi"), `${n.rssi} dBm`] : null, ago != null ? [c("last"), t("card.ago", { s: ago })] : null,
    n.beacon ? [c("beacon"), t("card.beaconValue", { zr: c(n.beacon.zr ? "accepted" : "refused"), zed: c(n.beacon.zed ? "accepted" : "refused") })] : null].filter(Boolean);
  const links = [...S.pairs.values()].filter(p => p.a === sel || p.b === sel).sort((a, b) => b.frames - a.frames)
    .map(p => `<li>${esc(t("card.linkRow", { name: label(p.a === sel ? p.b : p.a), frames: p.frames, pct: Math.round(retryRate(p) * 100) }))}</li>`).join("");
  // What only the network key reveals.
  const batt = S.batteries[n.addr];
  const keyed = [id && id.manufacturer ? [c("idMaker"), id.manufacturer] : null, id && id.model ? [c("idModel"), id.model] : null,
    id && id.power ? [c("idPower"), t("power." + (ZLM.has("power." + id.power) ? id.power : "unknown"))] : null,
    batt ? [c("battery"), batt.percent != null ? `${batt.percent} %` : `${batt.volts} V`] : null].filter(Boolean);
  const costRows = S.costs[sel] || [];
  const costs = costRows.map(r => { const hi = r.incoming >= 5 || r.outgoing >= 5; return `<li><span>${esc(label(r.addr))}</span><span class="${hi ? "hi" : ""}">${esc(t("card.costRow", { in: r.incoming, out: r.outgoing }))}</span></li>`; }).join("");
  const dl = rows => `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  $("detailName").textContent = label(sel);
  $("cardBody").innerHTML =
    `<div class="detailGroup"><h3>${esc(t("detail.clear"))}</h3>${dl(clear)}` +
    (links ? `<div class="note">${esc(c("links"))}</div><ul>${links}</ul>` : "") +
    `<p>${Object.entries(n.cats).sort((a, b) => b[1] - a[1]).map(([cat, k]) => chip(cat, ` <span class="n">${k}</span>`)).join(" ")}</p></div>` +
    `<div class="detailGroup keyed"><h3>${esc(t("detail.keyed"))}</h3>` +
    (keyed.length || costs
      ? (keyed.length ? dl(keyed) : "") + (costs ? `<div class="note">${esc(c("costs"))}</div><ul class="costs">${costs}</ul>` : "")
      : `<p class="note">${esc(t(S.security && S.security.keyKnown ? "detail.keyedWaiting" : "detail.keyless"))}</p>`) +
    `</div>`;
  $("renameForm").hidden = !n.ieee; $("btnWatch").hidden = !n.ieee;
  $("btnWatch").textContent = t(isFocus(n) ? "card.unwatch" : "card.watch"); $("btnWatch").setAttribute("aria-pressed", String(isFocus(n)));
  card.hidden = false;
}
function findIssues() {
  const out = [];
  if (S.security && S.security.vulnerable) out.push({ weight: 100, node: null, text: t("issues.vulnerable") });
  for (const [addr, costRows] of Object.entries(S.costs)) for (const r of costRows) {
    const worst = Math.max(r.incoming, r.outgoing);
    if (worst >= 5) out.push({ weight: 5 + worst / 10, node: addr, text: t("issues.cost", { a: label(addr), b: label(r.addr), in: r.incoming, out: r.outgoing }) });
  }
  for (const [addr, b] of Object.entries(S.batteries)) if (b.percent != null && b.percent <= 15)
    out.push({ weight: 4 - b.percent / 100, node: addr, text: t("issues.battery", { name: label(addr), pct: b.percent }) });
  for (const p of S.pairs.values()) if (quality(p) === "poor")
    out.push({ weight: 3 + retryRate(p), node: p.a, text: t("issues.link", { a: label(p.a), b: label(p.b), pct: Math.round(retryRate(p) * 100), frames: p.frames }) });
  for (const n of S.nodes.values()) {
    const name = label(n.addr), total = n.fwd.n + n.fwd.lost;
    if (n.fwd.lost >= 3 && n.fwd.lost / total >= .05) out.push({ weight: 2 + n.fwd.lost / total, node: n.addr, text: t("issues.notForwarded", { name, n: n.fwd.lost, total }) });
    if (n.fwd.n >= 10 && n.fwd.sum / n.fwd.n >= .1) out.push({ weight: 2, node: n.addr, text: t("issues.slow", { name, avg: ms1(n.fwd.sum / n.fwd.n) }) });
    if (n.ind.lost >= 2) out.push({ weight: 1.5, node: n.addr, text: t("issues.indirect", { name, n: n.ind.lost }) });
    if (n.rssi != null && n.rssi <= -88 && n.sent >= 5) out.push({ weight: 1, node: n.addr, text: t("issues.weak", { name, rssi: n.rssi }) });
  }
  if (S.total >= 200 && (S.counts.foreign || 0) / S.total >= .2) out.push({ weight: 1, node: null, text: t("issues.shared", { pct: Math.round(100 * S.counts.foreign / S.total) }) });
  return out.sort((a, b) => b.weight - a.weight);
}
let issuesShown = "";
function renderIssues() {
  const found = findIssues(), signature = found.map(i => i.text).join("|");
  if (signature === issuesShown) return;
  issuesShown = signature;
  $("issuesCount").textContent = found.length; $("issues").classList.toggle("has", found.length > 0); $("issuesNone").hidden = found.length > 0;
  const list = $("issuesList"); list.innerHTML = "";
  for (const issue of found) {
    const li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.textContent = issue.text;
    if (issue.node) b.addEventListener("click", () => { if (sel !== issue.node) select(issue.node); }); else b.disabled = true;
    li.appendChild(b); list.appendChild(li);
  }
}
function select(addr) {
  sel = sel === addr ? null : addr;
  if (sel && S.nodes.has(sel)) $("renameInput").value = nameOf(S.nodes.get(sel)) || "";
  renderDevices(); renderCard(); renderLog();
}
function renderHud() {
  const now = performance.now(); S.recent = S.recent.filter(x => now - x < 5000);
  $("sTotal").textContent = S.total; $("sRate").textContent = (S.recent.length / 5).toFixed(1); $("sNodes").textContent = S.nodes.size;
  $("pan").textContent = S.pan ? `PAN ${S.pan}` : "";
  const pill = $("conn"); let cls = "down", txt = t("status.down");
  if (connOpen) {
    if (sniffer.sniffer === "ok") { cls = "live"; txt = t("status.live"); }
    else if (sniffer.sniffer === "demo") { cls = "live"; txt = t("status.demo"); }
    else if (sniffer.sniffer === "replay") { cls = "live"; txt = t("status.replay", { name: sniffer.detail }); }
    else if (sniffer.sniffer === "absent") { cls = "down"; txt = t("status.absent"); }
    else { cls = "wait"; txt = t("status.starting"); }
  } else if (!ws || ws.readyState === 0) { cls = "wait"; txt = t("status.connecting"); }
  pill.className = "pill " + cls; $("connText").textContent = txt; pill.title = sniffer.detail || t("tip.status");
  const v = $("verdict"), f = S.focus; v.hidden = !S.focusIeee;
  if (S.focusIeee) {
    const name = (S.names[S.focusIeee] && S.names[S.focusIeee].name) || S.focusAddr || S.focusIeee;
    if (!S.focusAddr) v.textContent = t("verdict.wait", { name });
    else v.innerHTML = rich(t("verdict.text", { name, polls: f.polls, relayed: f.relayed, rebroadcast: f.rebroadcast })
      + (f.beacon ? t(f.beacon.zr || f.beacon.zed ? "verdict.beacon.open" : "verdict.beacon.closed") : "")
      + (f.joins.length ? t("verdict.joins", { ok: f.joins.filter(s => s === 0).length, ko: f.joins.filter(s => s !== 0).length }) : ""));
  }
  $("logInfo").textContent = frozen ? t("log.frozen", { n: pending }) : (sel ? t("log.filtered", { name: label(sel) }) : "");
}

// ------------------------------------------------------------------ language, theme, settings
function numbered(prefix) { const out = []; for (let i = 1; ZLM.has(`${prefix}.${i}.title`); i++) out.push([t(`${prefix}.${i}.title`), t(`${prefix}.${i}.body`)]); return out; }
function renderTexts() {
  document.title = `Zigbee ${t("app.brand2")}`;
  $("btnFreeze").textContent = t(frozen ? "log.resume" : "log.freeze");
  $("learn").innerHTML = CAT_ORDER.map(k => `<div class="lcard" style="--c:var(--c-${k})">${chip(k)}<p>${esc(catLearn(k))}</p></div>`).join("");
  $("anim").innerHTML = numbered("anim").map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${rich(p)}</p></div>`).join("");
  $("concepts").innerHTML = numbered("concepts").map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${rich(p)}</p></div>`).join("");
  issuesShown = ""; renderLegend(true); renderDevices(); renderCard(); renderIssues(); renderLog(); renderHud();
}
document.addEventListener("zlm:lang", renderTexts);
document.addEventListener("zlm:theme", loadPal);
ZLM.setExtras(box => {
  box.innerHTML = `<label class="opt"><input type="checkbox" id="optAnim"><span data-i18n="settings.animations"></span></label>`;
  const input = box.querySelector("#optAnim"); input.checked = animOn;
  input.addEventListener("change", () => { animOn = input.checked; prefs.set("anim", animOn ? null : "off"); });
});
$("btnSettings").addEventListener("click", () => ZLM.openSettings());

// ------------------------------------------------------------------ security dialog
let secDialog = null, secKeyMsg = "";
const numberedList = p => { const out = []; for (let i = 1; ZLM.has(`${p}.${i}`); i++) out.push(t(`${p}.${i}`)); return out; };
function buildSecurity() {
  secDialog = document.createElement("dialog");
  secDialog.className = "settings"; secDialog.setAttribute("aria-labelledby", "secTitle");
  secDialog.innerHTML = `
    <header><h2 id="secTitle" data-i18n="sec.title"></h2><button type="button" id="secClose" data-i18n-aria="settings.close">×</button></header>
    <div class="body">
      <section>
        <h3 data-i18n="sec.test.title"></h3>
        <div class="secbox" id="secVerdict" role="status"></div>
        <p class="note" data-i18n="sec.test.help"></p>
        <ol class="wizard" id="secWizard"></ol>
      </section>
      <section>
        <h3 data-i18n="sec.save.title"></h3>
        <p class="note" data-i18n="sec.save.help"></p>
        <p><button type="button" id="secSaveKey"></button></p>
        <p class="note" id="secKeyMsg" role="status"></p>
      </section>
    </div>`;
  document.body.appendChild(secDialog);
  secDialog.querySelector("#secClose").addEventListener("click", () => secDialog.close());
  secDialog.addEventListener("click", ev => { if (ev.target === secDialog) secDialog.close(); });
  secDialog.querySelector("#secWizard").innerHTML = numberedList("sec.step").map(s => `<li>${rich(s)}</li>`).join("");
  secDialog.querySelector("#secSaveKey").addEventListener("click", async () => {
    const s = S.security || {};
    if (!s.key || !s.pan) return;
    try { const res = await ZLM.getJson(`/api/keys/${encodeURIComponent(s.pan)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: s.key, label: "" }) }); S.security = res.security; secKeyMsg = t("sec.save.done", { pan: s.pan }); }
    catch (err) { secKeyMsg = t("sec.key.bad", { error: err.message }); }
    renderSecurity();
  });
}
function renderSecurity() {
  const s = S.security || {};
  $("btnSecurity").classList.toggle("vuln", !!s.vulnerable);
  if (!secDialog) return;
  ZLM.translate(secDialog);
  secDialog.querySelector("#secWizard").innerHTML = numberedList("sec.step").map(x => `<li>${rich(x)}</li>`).join("");
  const box = secDialog.querySelector("#secVerdict");
  let cls = "wait", html = `<b>${esc(t("sec.verdict.untested"))}</b>`;
  if (s.vulnerable) { cls = "vuln"; html = `<b>${esc(t("sec.verdict.vuln"))}</b><p>${rich(t("sec.verdict.vulnBody"))}</p>`; if (s.key) html += `<span class="keyval">${esc(s.key)}</span>`; }
  else if (s.secureJoinSeen) { cls = "safe"; html = `<b>${esc(t("sec.verdict.safe"))}</b><p>${rich(t("sec.verdict.safeBody"))}</p>`; }
  box.className = "secbox " + cls; box.innerHTML = html;
  const save = secDialog.querySelector("#secSaveKey");
  save.closest("section").hidden = !(s.vulnerable && s.key && s.pan);

}
$("btnSecurity").addEventListener("click", () => { if (!secDialog) buildSecurity(); secKeyMsg = ""; renderSecurity(); secDialog.showModal(); });
document.addEventListener("zlm:lang", () => { if (secDialog) renderSecurity(); });
$("btnFreeze").addEventListener("click", () => { frozen = !frozen; $("btnFreeze").setAttribute("aria-pressed", String(frozen)); $("btnFreeze").textContent = t(frozen ? "log.resume" : "log.freeze"); if (!frozen) renderLog(); });
for (let c = 11; c <= 26; c++) { const o = document.createElement("option"); o.value = c; o.textContent = c; $("chan").appendChild(o); }
$("chan").addEventListener("change", () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "channel", channel: Number($("chan").value) })); });

// ------------------------------------------------------------------ pointer and card interactions
function hit(ev) {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, ts = performance.now();
  let best = null, bd = 28;
  for (const n of S.nodes.values()) { const [px, py] = pos(n, ts), d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = n; } }
  return { n: best, x, y };
}
cv.addEventListener("pointermove", ev => {
  const h = hit(ev);
  if (drag) { drag.moved += Math.abs(ev.movementX) + Math.abs(ev.movementY); drag.n.x = (h.x - cam.w / 2) / cam.s; drag.n.y = (h.y - cam.h / 2) / cam.s; return; }
  hover = h.n ? h.n.addr : null; cv.style.cursor = h.n ? "pointer" : "default";
});
cv.addEventListener("pointerdown", ev => { const h = hit(ev); if (h.n) { drag = { n: h.n, moved: 0 }; cv.setPointerCapture(ev.pointerId); } });
cv.addEventListener("pointerup", ev => { if (drag) { if (drag.moved < 5) select(drag.n.addr); drag = null; } else if (!hit(ev).n && sel) select(null); });
cv.addEventListener("pointerleave", () => { hover = null; });
$("cardClose").addEventListener("click", () => select(null));
$("btnWatch").addEventListener("click", () => { const n = S.nodes.get(sel); if (n && n.ieee) { setFocus(isFocus(n) ? null : n.ieee, true); renderCard(); renderHud(); } });
$("renameForm").addEventListener("submit", ev => {
  ev.preventDefault(); const n = S.nodes.get(sel);
  if (n && n.ieee && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "rename", ieee: n.ieee, name: $("renameInput").value }));
});

// ------------------------------------------------------------------ websocket
function setNames(names, vendors) {
  S.names = names || {}; S.hint = new Map();

  if (vendors) S.vendors = vendors;
}
async function connect() {
  const token = await ZLM.token(true);   // always a fresh one: the tool may have been restarted
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { connOpen = true; };
  ws.onclose = () => { connOpen = false; setTimeout(connect, 2000); };
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if (d.type === "hello") {
      reset(); sel = null; setNames(d.names, d.vendors || {}); S.mode = d.mode; S.channel = d.channel; S.canTune = !!d.can_tune;
      S.focusIeee = (d.mode !== "demo" && prefs.get("focus", null)) || d.focus || null;

    else if (d.type === "security") { const { type, ...rest } = d; S.security = rest; dirty.security = true; dirty.card = true; issuesShown = "\u0000"; }
    else if (d.type === "identity") { S.identities[d.addr] = d.id; dirty.card = dirty.devices = true; }
    else if (d.type === "linkcosts") { S.costs[d.addr] = d.rows; dirty.card = true; issuesShown = "\u0000"; }
    else if (d.type === "battery") { S.batteries[d.addr] = d.batt; dirty.card = dirty.devices = true; issuesShown = "\u0000"; }

  };
}

// ------------------------------------------------------------------ start
(async () => {
  loadPal();
  await ZLM.init();                 // loads the texts, then fires zlm:lang, which renders them
  connect();
  let last = performance.now(), ticks = 0;
  const frame = ts => { physics(Math.min(.05, (ts - last) / 1000)); last = ts; draw(ts); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  setInterval(() => {
    renderHud(); drawRhythm();
    if (dirty.legend) { renderLegend(); dirty.legend = false; }
    if (dirty.devices) { renderDevices(); dirty.devices = false; }
    if (dirty.card) { renderCard(); dirty.card = false; }
    if (dirty.security) { renderSecurity(); dirty.security = false; }
    if (++ticks % 5 === 0) renderIssues();
  }, 400);
})();
window.zigbeeLiveMap = { get state() { return S; }, parts, rings, findIssues };
